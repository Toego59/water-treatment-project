<!-- BACK LAYER: deep-water gradient with a few rising bubbles. Moves slowest. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b3c49"/><stop offset="1" stop-color="#1a7a8f"/></linearGradient></defs>
  <rect width="1440" height="800" fill="url(#g)"/>
  <g fill="none" stroke="#bfe9f2" stroke-opacity=".35" stroke-width="2">
    <circle cx="180" cy="520" r="14"/><circle cx="260" cy="610" r="7"/><circle cx="520" cy="470" r="10"/>
    <circle cx="860" cy="560" r="16"/><circle cx="1010" cy="430" r="6"/><circle cx="1240" cy="590" r="12"/>
  </g>
</svg>
